[package]
name = "preview-maker"
version = "1.0.0"
description = "Finds and saves preview images for 3DDD models."
license = "AGPL-3.0-only"
edition = "2024"

[dependencies]
eframe = "0.33"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }
